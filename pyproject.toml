[project]
name = "fable-handoff"
version = "1.1.0"
description = "Claude Code skill: prepare a project for a long unattended Claude Fable 5.2 run, then launch, watch and review it."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest==9.0.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
